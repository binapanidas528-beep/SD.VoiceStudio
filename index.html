<script>
        let currentLang = 'hi';
        let lastText = '';

        document.getElementById('voice-script').addEventListener('input', (e) => {
            document.getElementById('char-count').innerText = `${e.target.value.length} chars`;
        });

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.className = "lang-btn text-xs px-3 py-1 rounded-lg font-medium transition text-slate-400 hover:text-white";
            });
            document.getElementById(`lang-${lang}`).className = "lang-btn text-xs px-3 py-1 rounded-lg font-medium transition bg-indigo-600 text-white";
        }

        function generateAudio() {
            const script = document.getElementById('voice-script').value.trim();
            if (!script) return alert("Kripya text enter karein!");

            lastText = script;
            const outputBox = document.getElementById('text-output');
            const audioPlayer = document.getElementById('audio-player');
            const downloadBtn = document.getElementById('download-btn');

            // Stop any ongoing speech
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(script);
            utterance.lang = currentLang === 'hi' ? 'hi-IN' : currentLang === 'or' ? 'or-IN' : currentLang === 'bn' ? 'bn-IN' : 'en-US';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            utterance.onstart = () => {
                outputBox.innerHTML = `<strong>Playing Audio:</strong><br>${script}`;
            };

            window.speechSynthesis.speak(utterance);

            // Show audio player simulation & download button
            audioPlayer.classList.remove('hidden');
            downloadBtn.classList.remove('hidden');
        }

        function downloadAudio() {
            if (!lastText) return alert("Pehle audio generate karein!");
            
            // Create text/script project file for local players
            const blob = new Blob([lastText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `SD_VoiceStudio_Script_${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            alert("Script file download ho gayi hai!");
        }
    </script>
