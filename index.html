<!DOCTYPE html>
<html lang="en" id="html-root" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD.VoiceStudio - Multilingual Text to Speech Engine</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- Header -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 py-4 px-6 flex justify-between items-center shadow-md flex-wrap gap-3">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-xl font-bold text-white shadow-md shadow-indigo-500/30">
                🎙️
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide text-slate-900 dark:text-white">SD.VoiceStudio</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">Multilingual Male & Female Voice Generator</p>
            </div>
        </div>

        <button onclick="toggleTheme()" class="bg-slate-200 dark:bg-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-600 transition">
            <span id="theme-icon">☀️ Light</span>
        </button>
    </header>

    <!-- Main Studio Box -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 space-y-6">

        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 shadow-md space-y-4">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Voice Language/Voice List Selector -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">🌐 Select System Voice & Accent</label>
                    <select id="voice-select" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs rounded-xl p-2.5 focus:outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-100 font-medium">
                        <option value="">Loading Voices... ⏳</option>
                    </select>
                </div>

                <!-- Voice Gender Tone Preset -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">👤 Voice Tone Preset</label>
                    <select id="gender-preset" onchange="applyGenderPreset()" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs rounded-xl p-2.5 focus:outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-100 font-medium">
                        <option value="female">👩 Female Tone (Default)</option>
                        <option value="male">👨 Male Tone (Deep Pitch)</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Speed Control -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">⚡ Speed: <span id="speed-val" class="text-indigo-500 font-bold">1.0x</span></label>
                    <input type="range" id="rate-range" min="0.5" max="2" value="1" step="0.1" oninput="document.getElementById('speed-val').innerText = this.value + 'x'" class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer">
                </div>

                <!-- Pitch Control -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">🎵 Pitch Tone: <span id="pitch-val" class="text-indigo-500 font-bold">1.0</span></label>
                    <input type="range" id="pitch-range" min="0.3" max="1.6" value="1" step="0.1" oninput="document.getElementById('pitch-val').innerText = this.value" class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>

            <!-- Text Area -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">✍️ Text Input (Odia, Hindi, English, Bengali, etc.):</label>
                <textarea id="text-input" rows="6" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl p-4 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:border-indigo-500 transition" placeholder="Write text here..."></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-3">
                <button onclick="playVoice()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl text-xs transition shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2">
                    <span>🔊</span> <span>Play Audio</span>
                </button>
                <button onclick="stopVoice()" class="bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-semibold py-3 px-5 rounded-xl text-xs transition">
                    ⏹️ Stop
                </button>
            </div>

        </div>

    </main>

    <script>
        let synth = window.speechSynthesis;
        let voices = [];

        function populateVoices() {
            voices = synth.getVoices();
            const voiceSelect = document.getElementById('voice-select');
            voiceSelect.innerHTML = '';

            voices.forEach((voice, i) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.setAttribute('data-lang', voice.lang);
                option.setAttribute('data-name', voice.name);
                option.value = i;
                voiceSelect.appendChild(option);
            });

            if(voices.length === 0) {
                voiceSelect.innerHTML = '<option>No Browser Voices Found</option>';
            }
        }

        populateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }

        function applyGenderPreset() {
            const preset = document.getElementById('gender-preset').value;
            const pitchSlider = document.getElementById('pitch-range');
            if (preset === 'male') {
                pitchSlider.value = 0.6;
            } else {
                pitchSlider.value = 1.0;
            }
            document.getElementById('pitch-val').innerText = pitchSlider.value;
        }

        function toggleTheme() {
            const html = document.getElementById('html-root');
            const themeIcon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                themeIcon.innerText = "🌙 Dark";
            } else {
                html.classList.add('dark');
                themeIcon.innerText = "☀️ Light";
            }
        }

        function playVoice() {
            synth.cancel();
            const text = document.getElementById('text-input').value.trim();
            if (!text) return alert('Please enter text!');

            const utterance = new SpeechSynthesisUtterance(text);
            const selectedVoiceIndex = document.getElementById('voice-select').value;

            if (voices[selectedVoiceIndex]) {
                utterance.voice = voices[selectedVoiceIndex];
            }

            utterance.rate = parseFloat(document.getElementById('rate-range').value);
            utterance.pitch = parseFloat(document.getElementById('pitch-range').value);

            synth.speak(utterance);
        }

        function stopVoice() {
            synth.cancel();
        }
    </script>
</body>
</html>
