<!DOCTYPE html>
<html lang="or" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD.VoiceStudio - AI Voice & Audio Companion</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">

    <!-- Google Analytics Tag -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HT9DDR3Y98"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-HT9DDR3Y98');
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                <i class="fa-solid fa-microphone-lines text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-none tracking-tight">SD.VoiceStudio</h1>
                <p class="text-xs text-slate-400 mt-1">Class 5 to PhD • AI Voice & Audio Companion</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span id="api-status" class="text-xs px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">
                <i class="fa-solid fa-circle text-[8px] mr-1"></i> Server Proxy Active
            </span>
        </div>
    </header>

    <!-- Main Grid -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Controls Section -->
        <section class="lg:col-span-6 space-y-5">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-language text-indigo-400"></i> Select Language
                    </label>
                    <div class="flex gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                        <button onclick="setLang('or')" id="lang-or" class="lang-btn text-xs px-3 py-1 rounded-lg font-medium transition bg-indigo-600 text-white">Odia</button>
                        <button onclick="setLang('hi')" id="lang-hi" class="lang-btn text-xs px-3 py-1 rounded-lg font-medium transition text-slate-400 hover:text-white">Hindi</button>
                        <button onclick="setLang('en')" id="lang-en" class="lang-btn text-xs px-3 py-1 rounded-lg font-medium transition text-slate-400 hover:text-white">English</button>
                        <button onclick="setLang('bn')" id="lang-bn" class="lang-btn text-xs px-3 py-1 rounded-lg font-medium transition text-slate-400 hover:text-white">Bengali</button>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center justify-between">
                        <span><i class="fa-solid fa-pen-nib text-indigo-400 mr-1"></i> Input Script / Prompt</span>
                        <span id="char-count" class="text-[10px] text-slate-500">0 chars</span>
                    </label>
                    <div class="relative">
                        <textarea id="voice-script" rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition resize-none" placeholder="Apna content ya question yahan likhein..."></textarea>
                        <button onclick="toggleRecording()" id="mic-btn" class="absolute right-3 bottom-3 w-9 h-9 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition border border-slate-700" title="Voice Input">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                    </div>
                </div>

                <!-- Gender & Voice Persona Selection -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-slate-300">Voice Gender</label>
                        <div class="flex gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
                            <button onclick="setGender('female')" id="gender-female" class="gender-btn flex-1 text-xs py-2 rounded-lg font-medium transition bg-indigo-600 text-white flex items-center justify-center gap-1">
                                <i class="fa-solid fa-venus"></i> Female
                            </button>
                            <button onclick="setGender('male')" id="gender-male" class="gender-btn flex-1 text-xs py-2 rounded-lg font-medium transition text-slate-400 hover:text-white flex items-center justify-center gap-1">
                                <i class="fa-solid fa-mars"></i> Male
                            </button>
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-slate-300">Voice Tone / Persona</label>
                        <select id="voice-persona" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="Puck">Puck (Upbeat & Energetic)</option>
                            <option value="Charon">Charon (Deep & Professional)</option>
                            <option value="Kore">Kore (Calm & Gentle)</option>
                            <option value="Fenrir">Fenrir (Authoritative)</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Action Mode</label>
                    <select id="action-mode" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="tts">🔊 Direct Text-to-Speech</option>
                        <option value="explain">🤖 AI Audio Explanation</option>
                    </select>
                </div>

                <button onclick="processAudio()" id="generate-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-semibold text-sm py-3 px-4 rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>Generate MP3 Audio</span>
                </button>
            </div>
        </section>

        <!-- Output Section -->
        <section class="lg:col-span-6 space-y-5">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl min-h-[380px] flex flex-col justify-between">
                
                <div>
                    <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                        <h2 class="text-sm font-bold text-indigo-400 flex items-center gap-2">
                            <i class="fa-solid fa-robot"></i> AI Studio Output
                        </h2>
                        <span id="output-badge" class="text-[10px] px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Ready</span>
                    </div>

                    <div id="text-output" class="text-xs text-slate-300 leading-relaxed bg-slate-950 p-4 rounded-xl border border-slate-800 max-h-[180px] overflow-y-auto mb-4">
                        Audio generate hone ke baad MP3 player yahan chalu ho jayega aur Edius ke liye download kar sakengi!
                    </div>
                </div>

                <!-- Verified MP3 Player & Edius Compatible Download -->
                <div class="space-y-3 bg-slate-950 border border-slate-800 rounded-xl p-4">
                    <audio id="audio-player" controls class="w-full rounded-lg h-10 hidden"></audio>

                    <button onclick="downloadMP3()" id="download-btn" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20">
                        <i class="fa-solid fa-download text-sm"></i>
                        <span>Download MP3 File (for Edius / Windows Media Player)</span>
                    </button>
                </div>

            </div>
        </section>

    </main>

    <script>
        const WORKER_PROXY = "https://sd-voicestudio.binapanidas528.workers.dev";
        let currentLang = 'hi';
        let currentGender = 'female';
        let mp3BlobUrl = '';

        document.getElementById('voice-script').addEventListener('input', (e) => {
            document.getElementById('char-count').innerText = `${e.target.value.length} chars`;
        });

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.className = "lang-btn text-xs px-3 py-1 rounded-lg font-medium transition text-slate-400 hover:text-white";
            });
            document.getElementById(`lang-${lang}`).className = "lang-btn text-xs px-3 py-1 rounded-lg font-medium transition bg-indigo-600 text-white";
        }

        function setGender(gender) {
            currentGender = gender;
            document.querySelectorAll('.gender-btn').forEach(btn => {
                btn.className = "gender-btn flex-1 text-xs py-2 rounded-lg font-medium transition text-slate-400 hover:text-white";
            });
            document.getElementById(`gender-${gender}`).className = "gender-btn flex-1 text-xs py-2 rounded-lg font-medium transition bg-indigo-600 text-white";
        }

        async function processAudio() {
            const script = document.getElementById('voice-script').value.trim();
            if (!script) return alert("Kripya script ya text enter karein!");

            const mode = document.getElementById('action-mode').value;
            const btn = document.getElementById('generate-btn');
            const outputBox = document.getElementById('text-output');
            const audioPlayer = document.getElementById('audio-player');
            const downloadBtn = document.getElementById('download-btn');
            
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing MP3...`;

            try {
                let textToProcess = script;
                if (mode === 'explain') {
                    const res = await fetch(WORKER_PROXY, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: script, lang: currentLang, mode: 'explain' })
                    });
                    const data = await res.json();
                    textToProcess = data.candidates[0].content.parts[0].text;
                }

                outputBox.innerHTML = `<strong>Generating MP3 Audio (${currentGender.toUpperCase()}):</strong><br>${textToProcess}`;

                // Call Proxy for Direct MP3 Binary Buffer
                const audioRes = await fetch(WORKER_PROXY, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: textToProcess, lang: currentLang, mode: 'tts' })
                });

                if (!audioRes.ok) throw new Error("Server audio generate nahi kar paya.");

                const blob = await audioRes.blob();
                
                // Ensure proper MP3 mime type
                const mp3Blob = new Blob([blob], { type: 'audio/mp3' });
                mp3BlobUrl = URL.createObjectURL(mp3Blob);

                audioPlayer.src = mp3BlobUrl;
                audioPlayer.classList.remove('hidden');
                audioPlayer.play();

                downloadBtn.classList.remove('hidden');

            } catch (err) {
                outputBox.innerHTML = `<span class="text-rose-400">Error: ${err.message}</span>`;
            }

            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> <span>Generate MP3 Audio</span>`;
        }

        function downloadMP3() {
            if (!mp3BlobUrl) return;
            const a = document.createElement('a');
            a.href = mp3BlobUrl;
            a.download = `SD_VoiceStudio_${Date.now()}.mp3`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function toggleRecording() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                return alert("Aapka browser Speech Recognition support nahi karta. Google Chrome use karein.");
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = currentLang === 'hi' ? 'hi-IN' : currentLang === 'or' ? 'or-IN' : currentLang === 'bn' ? 'bn-IN' : 'en-US';

            const micBtn = document.getElementById('mic-btn');
            micBtn.classList.add('text-rose-500', 'animate-pulse');

            recognition.start();

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('voice-script').value += " " + text;
                micBtn.classList.remove('text-rose-500', 'animate-pulse');
            };

            recognition.onerror = () => {
                micBtn.classList.remove('text-rose-500', 'animate-pulse');
            };
        }
    </script>
</body>
</html>
