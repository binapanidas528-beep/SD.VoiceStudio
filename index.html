<!DOCTYPE html>
<html lang="or" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD.VoiceStudio - AI Voice & Audio Companion</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HT9DDR3Y98"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-HT9DDR3Y98');
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                <i class="fa-solid fa-microphone-lines text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-none tracking-tight">SD.VoiceStudio</h1>
                <p class="text-xs text-slate-400 mt-1">Class 5 to PhD • AI Voice & Audio Companion</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-xs px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">
                <i class="fa-solid fa-circle text-[8px] mr-1"></i> Direct MP3 Engine Active
            </span>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        <section class="lg:col-span-6 space-y-5">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-language text-indigo-400"></i> Select Language
                    </label>
                    <div class="flex gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                        <button onclick="setLang('or')" id="lang-or" class="lang-btn text-xs px-3 py-1 rounded-lg font-medium transition bg-indigo-600 text-white">Odia</button>
                        <button onclick="setLang('hi')" id="lang-hi" class="lang-btn text-xs px-3 py-1 rounded-lg font-medium transition text-slate-400 hover:text-white">Hindi</button>
                        <button onclick="setLang('en')" id="lang-en" class="lang-btn text-xs px-3 py-1 rounded-lg font-medium transition text-slate-400 hover:text-white">English</button>
                        <button onclick="setLang('bn')" id="lang-bn" class="lang-btn text-xs px-3 py-1 rounded-lg font-medium transition text-slate-400 hover:text-white">Bengali</button>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center justify-between">
                        <span><i class="fa-solid fa-pen-nib text-indigo-400 mr-1"></i> Input Script / Prompt</span>
                        <span id="char-count" class="text-[10px] text-slate-500">0 chars</span>
                    </label>
                    <div class="relative">
                        <textarea id="voice-script" rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition resize-none" placeholder="Yahan apna text likhein..."></textarea>
                    </div>
                </div>

                <button onclick="generateDirectMP3()" id="generate-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-semibold text-sm py-3 px-4 rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>Generate & Play MP3 Audio</span>
                </button>
            </div>
        </section>

        <section class="lg:col-span-6 space-y-5">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl min-h-[380px] flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                        <h2 class="text-sm font-bold text-indigo-400 flex items-center gap-2">
                            <i class="fa-solid fa-robot"></i> AI Studio Output
                        </h2>
                    </div>

                    <div id="text-output" class="text-xs text-slate-300 leading-relaxed bg-slate-950 p-4 rounded-xl border border-slate-800 max-h-[160px] overflow-y-auto mb-4">
                        Text enter karke "Generate & Play MP3 Audio" button dabayein!
                    </div>
                </div>

                <div class="space-y-3 bg-slate-950 border border-slate-800 rounded-xl p-4">
                    <audio id="audio-player" controls class="w-full rounded-lg h-10 hidden"></audio>

                    <button onclick="downloadMP3File()" id="download-btn" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20">
                        <i class="fa-solid fa-download text-sm"></i>
                        <span>Download Real MP3 (Media Player / Winamp / Android)</span>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script>
        let currentLang = 'hi';
        let mp3AudioBlob = null;
        let mp3Url = '';

        document.getElementById('voice-script').addEventListener('input', (e) => {
            document.getElementById('char-count').innerText = `${e.target.value.length} chars`;
        });

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.className = "lang-btn text-xs px-3 py-1 rounded-lg font-medium transition text-slate-400 hover:text-white";
            });
            document.getElementById(`lang-${lang}`).className = "lang-btn text-xs px-3 py-1 rounded-lg font-medium transition bg-indigo-600 text-white";
        }

        async function generateDirectMP3() {
            const script = document.getElementById('voice-script').value.trim();
            if (!script) return alert("Kripya text enter karein!");

            const btn = document.getElementById('generate-btn');
            const outputBox = document.getElementById('text-output');
            const audioPlayer = document.getElementById('audio-player');
            const downloadBtn = document.getElementById('download-btn');

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Generating MP3 Audio...`;

            try {
                // Direct Google TTS Engine audio stream URL
                const targetLang = currentLang === 'hi' ? 'hi' : currentLang === 'or' ? 'or' : currentLang === 'bn' ? 'bn' : 'en';
                const gTtsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(script)}&tl=${targetLang}&client=tw-ob`;

                const res = await fetch(gTtsUrl);
                if (!res.ok) throw new Error("Audio stream build failed.");

                const arrayBuffer = await res.arrayBuffer();
                mp3AudioBlob = new Blob([arrayBuffer], { type: 'audio/mpeg' });
                mp3Url = URL.createObjectURL(mp3AudioBlob);

                outputBox.innerHTML = `<strong>MP3 Generated Successfully:</strong><br>${script}`;
                
                audioPlayer.src = mp3Url;
                audioPlayer.classList.remove('hidden');
                audioPlayer.play();

                downloadBtn.classList.remove('hidden');

            } catch (err) {
                // Fallback direct URL player if fetch is constrained
                const targetLang = currentLang === 'hi' ? 'hi' : currentLang === 'or' ? 'or' : currentLang === 'bn' ? 'bn' : 'en';
                mp3Url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(script)}&tl=${targetLang}&client=tw-ob`;
                
                audioPlayer.src = mp3Url;
                audioPlayer.classList.remove('hidden');
                audioPlayer.play();

                outputBox.innerHTML = `<strong>MP3 Playing:</strong><br>${script}`;
                downloadBtn.classList.remove('hidden');
            }

            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> <span>Generate & Play MP3 Audio</span>`;
        }

        async function downloadMP3File() {
            if (!mp3Url) return alert("Pehle MP3 generate karein!");

            if (mp3AudioBlob) {
                const a = document.createElement('a');
                a.href = mp3Url;
                a.download = `SD_VoiceStudio_${Date.now()}.mp3`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } else {
                const res = await fetch(mp3Url);
                const blob = await res.blob();
                const blobUrl = URL.createObjectURL(new Blob([blob], { type: 'audio/mpeg' }));
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `SD_VoiceStudio_${Date.now()}.mp3`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }
    </script>
</body>
</html>
