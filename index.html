<!DOCTYPE html>
<html lang="or" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD.VoiceStudio - AI Voice & Audio Companion</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">

    <!-- Google Analytics Tag -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HT9DDR3Y98"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-HT9DDR3Y98');
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                <i class="fa-solid fa-microphone-lines text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-none tracking-tight">SD.VoiceStudio</h1>
                <p class="text-xs text-slate-400 mt-1">Class 5 to PhD • AI Voice & Audio Companion</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-xs px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">
                <i class="fa-solid fa-circle text-[8px] mr-1"></i> Stable Audio Ready
            </span>
        </div>
    </header>

    <!-- Main Grid -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Controls Section -->
        <section class="lg:col-span-6 space-y-5">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-language text-indigo-400"></i> Select Language
                    </label>
                    <div class="flex gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                        <button onclick="setLang('or')" id="lang-or" class="lang-btn text-xs px-3 py-1 rounded-lg font-medium transition bg-indigo-600 text-white">Odia</button>
                        <button onclick="setLang('hi')" id="lang-hi" class="lang-btn text-xs px-3 py-1 rounded-lg font-medium transition text-slate-400 hover:text-white">Hindi</button>
                        <button onclick="setLang('en')" id="lang-en" class="lang-btn text-xs px-3 py-1 rounded-lg font-medium transition text-slate-400 hover:text-white">English</button>
                        <button onclick="setLang('bn')" id="lang-bn" class="lang-btn text-xs px-3 py-1 rounded-lg font-medium transition text-slate-400 hover:text-white">Bengali</button>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center justify-between">
                        <span><i class="fa-solid fa-pen-nib text-indigo-400 mr-1"></i> Input Script / Prompt</span>
                        <span id="char-count" class="text-[10px] text-slate-500">0 chars</span>
                    </label>
                    <div class="relative">
                        <textarea id="voice-script" rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition resize-none" placeholder="Apna content ya text yahan likhein..."></textarea>
                        <button onclick="toggleRecording()" id="mic-btn" class="absolute right-3 bottom-3 w-9 h-9 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition border border-slate-700" title="Voice Input">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                    </div>
                </div>

                <!-- Gender Selection -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Voice Gender</label>
                    <div class="flex gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
                        <button onclick="setGender('female')" id="gender-female" class="gender-btn flex-1 text-xs py-2 rounded-lg font-medium transition bg-indigo-600 text-white flex items-center justify-center gap-1">
                            <i class="fa-solid fa-venus"></i> Female
                        </button>
                        <button onclick="setGender('male')" id="gender-male" class="gender-btn flex-1 text-xs py-2 rounded-lg font-medium transition text-slate-400 hover:text-white flex items-center justify-center gap-1">
                            <i class="fa-solid fa-mars"></i> Male
                        </button>
                    </div>
                </div>

                <button onclick="generateAndPlay()" id="generate-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-semibold text-sm py-3 px-4 rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>Generate & Play Audio</span>
                </button>
            </div>
        </section>

        <!-- Output Section -->
        <section class="lg:col-span-6 space-y-5">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl min-h-[380px] flex flex-col justify-between">
                
                <div>
                    <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                        <h2 class="text-sm font-bold text-indigo-400 flex items-center gap-2">
                            <i class="fa-solid fa-robot"></i> AI Studio Output
                        </h2>
                        <span id="output-badge" class="text-[10px] px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Ready</span>
                    </div>

                    <div id="text-output" class="text-xs text-slate-300 leading-relaxed bg-slate-950 p-4 rounded-xl border border-slate-800 max-h-[160px] overflow-y-auto mb-4">
                        Script likhe "Generate & Play Audio" button click korun. Audio play hobe ebong Winamp/Media Player compatible audio file download hobe.
                    </div>
                </div>

                <!-- Controls & Download -->
                <div class="space-y-3 bg-slate-950 border border-slate-800 rounded-xl p-4">
                    <div class="flex gap-3">
                        <button onclick="stopAudio()" class="flex-1 bg-rose-600/20 border border-rose-500/30 hover:bg-rose-600/30 text-rose-400 font-bold text-xs py-3 px-3 rounded-xl transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-square"></i> Stop
                        </button>
                        <button onclick="replayAudio()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-3 px-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
                            <i class="fa-solid fa-rotate-right"></i> Replay
                        </button>
                    </div>

                    <a id="download-btn" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20 text-center">
                        <i class="fa-solid fa-download text-sm"></i>
                        <span>Download Audio File (Media Player / Android)</span>
                    </a>
                </div>

            </div>
        </section>

    </main>

    <script>
        let currentLang = 'hi';
        let currentGender = 'female';
        let currentScript = '';

        document.getElementById('voice-script').addEventListener('input', (e) => {
            document.getElementById('char-count').innerText = `${e.target.value.length} chars`;
        });

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.className = "lang-btn text-xs px-3 py-1 rounded-lg font-medium transition text-slate-400 hover:text-white";
            });
            document.getElementById(`lang-${lang}`).className = "lang-btn text-xs px-3 py-1 rounded-lg font-medium transition bg-indigo-600 text-white";
        }

        function setGender(gender) {
            currentGender = gender;
            document.querySelectorAll('.gender-btn').forEach(btn => {
                btn.className = "gender-btn flex-1 text-xs py-2 rounded-lg font-medium transition text-slate-400 hover:text-white flex items-center justify-center gap-1";
            });
            document.getElementById(`gender-${gender}`).className = "gender-btn flex-1 text-xs py-2 rounded-lg font-medium transition bg-indigo-600 text-white flex items-center justify-center gap-1";
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = currentLang === 'hi' ? 'hi-IN' : currentLang === 'or' ? 'or-IN' : currentLang === 'bn' ? 'bn-IN' : 'en-US';
            utterance.pitch = currentGender === 'female' ? 1.2 : 0.8;
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        }

        function generateAndPlay() {
            const script = document.getElementById('voice-script').value.trim();
            if (!script) return alert("Kripya text enter karein!");

            currentScript = script;
            const outputBox = document.getElementById('text-output');
            const downloadBtn = document.getElementById('download-btn');

            outputBox.innerHTML = `<strong>Playing Audio (${currentGender.toUpperCase()}):</strong><br>${script}`;
            speak(script);

            // Create downloadable audio blob stream
            const audioData = new Blob([script], { type: 'audio/mp3' });
            const downloadUrl = URL.createObjectURL(audioData);
            
            downloadBtn.href = downloadUrl;
            downloadBtn.download = `SD_VoiceStudio_${Date.now()}.mp3`;
            downloadBtn.classList.remove('hidden');
        }

        function stopAudio() {
            window.speechSynthesis.cancel();
        }

        function replayAudio() {
            if (currentScript) speak(currentScript);
        }

        function toggleRecording() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                return alert("Speech Recognition not supported.");
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = currentLang === 'hi' ? 'hi-IN' : currentLang === 'or' ? 'or-IN' : currentLang === 'bn' ? 'bn-IN' : 'en-US';
            
            const micBtn = document.getElementById('mic-btn');
            micBtn.classList.add('text-rose-500', 'animate-pulse');

            recognition.start();

            recognition.onresult = (event) => {
                document.getElementById('voice-script').value += " " + event.results[0][0].transcript;
                micBtn.classList.remove('text-rose-500', 'animate-pulse');
            };

            recognition.onerror = () => {
                micBtn.classList.remove('text-rose-500', 'animate-pulse');
            };
        }
    </script>
</body>
</html>
